<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Video Dub</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="side">
    <header>
      <div class="title" id="title">AI Video Dub</div>
      <div class="controls">
        <button id="translate" type="button" title="Translate the subtitles, without the voice" disabled>Translate</button>
        <button id="toggle" class="primary" type="button" title="Alt+Shift+D" disabled>Dub this video</button>
        <label class="check" id="original-label"><input id="original" type="checkbox" /> Original</label>
        <span class="size">
          <select id="font" title="Font of the subtitles"></select>
          <button id="smaller" type="button" title="Smaller text">A−</button>
          <button id="larger" type="button" title="Larger text">A+</button>
        </span>
      </div>
      <p id="status" class="status"></p>
      <nav class="tabs" role="tablist">
        <button id="tab-subs" class="tab" type="button" role="tab" data-tab="subs">Subtitles</button>
        <button id="tab-summary" class="tab" type="button" role="tab" data-tab="summary">Summary</button>
        <button id="tab-rewrite" class="tab" type="button" role="tab" data-tab="rewrite">Rewrite</button>
      </nav>
    </header>
    <div id="pane-subs" class="pane" role="tabpanel">
      <main id="lines"></main>
      <p id="empty" class="empty"></p>
    </div>
    <div id="pane-summary" class="pane doc" role="tabpanel" hidden>
      <div id="summary-bar" class="doc-bar">
        <span id="summary-status" class="doc-status"></span>
        <button id="summary-copy" type="button">Copy</button>
        <button id="summary-run" type="button"></button>
      </div>
      <div id="summary-body" class="doc-body"></div>
      <p id="summary-empty" class="empty"></p>
    </div>
    <div id="pane-rewrite" class="pane doc" role="tabpanel" hidden>
      <div id="rewrite-bar" class="doc-bar">
        <span id="rewrite-status" class="doc-status"></span>
        <button id="rewrite-copy" type="button">Copy</button>
        <button id="rewrite-epub" type="button" title="Download the rewrite as an e-book">Download EPUB</button>
        <button id="rewrite-library" type="button" title="Add the rewrite to a book in Fukurou Library, as a new chapter">Add to library</button>
        <button id="rewrite-run" type="button"></button>
      </div>
      <div id="library" class="library" hidden></div>
      <div id="rewrite-body" class="doc-body"></div>
      <p id="rewrite-empty" class="empty"></p>
    </div>
    <script src="shared.js"></script>
    <script src="epub.js"></script>
    <script src="library.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
